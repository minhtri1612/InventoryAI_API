services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MAX_TOKENS: "512"
      TEMPERATURE: "0.1"
      DATABASE_PATH: /data/inventory.db
      EMBEDDING_MODEL: all-minilm
      VECTOR_SIZE: "384"
      SEMANTIC_SCORE_THRESHOLD: "0.5"
    volumes:
      - inventory_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - inventory-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - inventory-network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - inventory-network

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:3b && ollama pull all-minilm"]
    networks:
      - inventory-network

volumes:
  qdrant_data:
  ollama_data:
  inventory_data:

networks:
  inventory-network:
    driver: bridge
